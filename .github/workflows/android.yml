name: 打包 APK

# 手动点一下就构建；打 tag（v1.0 这样）则顺便发一个 Release，
# 群里发链接比发文件方便
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号（显示在系统的应用信息里，例如 1.0）'
        required: false
        default: ''
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # 签名密钥全程留在 GitHub 上。加密后的那份提交进仓库 ——
      # 仓库是公开的，所以绝不能存明文；解密只在构建时、在跑机器上发生。
      # 你要做的只有一件事：设一个 ANDROID_KEYSTORE_PASSWORD。
      - name: 准备签名密钥
        id: ks
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PW:-}" ]; then
            echo "::notice::还没有设置 ANDROID_KEYSTORE_PASSWORD，这次只做编译检查，不出安装包。"
            echo "signed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ENC=android/keystore.jks.enc
          OUT="$RUNNER_TEMP/keystore.jks"
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 1000000 \
              -in "$ENC" -out "$OUT" -pass env:PW \
              || { echo "::error::密钥解不开 —— ANDROID_KEYSTORE_PASSWORD 跟当初生成时填的不是同一个。"; exit 1; }
            echo "用的是仓库里已有的签名密钥"
          else
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::还没有签名密钥。先在 main 分支手动跑一次这个 workflow 把密钥建出来，再打 tag。"
              exit 1
            fi
            echo "仓库里还没有密钥，现在建一把"
            keytool -genkeypair -v -keystore "$OUT" -alias yoww \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PW" -keypass "$PW" \
              -dname "CN=Yoww, OU=Yoww, O=Yoww, L=-, ST=-, C=CN"
            openssl enc -aes-256-cbc -pbkdf2 -iter 1000000 -salt \
              -in "$OUT" -out "$ENC" -pass env:PW
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add "$ENC"
            git commit -m '签名密钥（已加密，只有 ANDROID_KEYSTORE_PASSWORD 能解开）'
            git push origin HEAD:"${{ github.ref_name }}"
            echo "::notice::密钥已建好并加密存进仓库。密码一定要自己记牢：丢了就再也签不出能覆盖安装的新版本。"
          fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "signed=yes" >> "$GITHUB_OUTPUT"

      - name: 版本号
        id: ver
        run: |
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$NAME" ] || [ "$NAME" = "main" ]; then NAME="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # 没有密钥时只编译不出包。产出一个每次签名都不一样的 APK 更糟：
      # 装过的人再装新版会被系统按"签名不一致"拒掉，只能先卸载。
      - name: 构建
        working-directory: android
        env:
          YOWW_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          YOWW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YOWW_KEY_ALIAS: yoww
        run: |
          chmod +x gradlew
          if [ "${{ steps.ks.outputs.signed }}" = "yes" ]; then
            ./gradlew --no-daemon assembleRelease \
              -PversionNameOverride="${{ steps.ver.outputs.name }}" \
              -PversionCodeOverride="${{ github.run_number }}"
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: 打包结果
        run: |
          if [ "${{ steps.ks.outputs.signed }}" != "yes" ]; then
            echo "### 构建通过，但还没有可分发的安装包" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "去 Settings → Secrets and variables → Actions 加一条 \`ANDROID_KEYSTORE_PASSWORD\`，" >> "$GITHUB_STEP_SUMMARY"
            echo "再回来跑一次，就会自动建密钥并出包。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/Yoww-${{ steps.ver.outputs.name }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        if: steps.ks.outputs.signed == 'yes'
        with:
          name: Yoww-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.ks.outputs.signed == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body: |
            装之前手机要允许「安装未知来源应用」。

            界面是在线加载的，所以网站更新后 App 里直接就是新版，不用重装。
            只有这个外壳本身改了（比如下载、选文件相关）才需要换新的 APK。
