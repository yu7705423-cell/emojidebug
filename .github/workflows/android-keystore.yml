name: 生成签名密钥

# 只需要跑一次。产物里的 keystore.jks 要自己收好 ——
# 换一把新的密钥重新打包，装过旧版的人必须先卸载才能装新版。
on:
  workflow_dispatch:
    inputs:
      password:
        description: '给密钥设一个密码（至少 6 位，自己记住）'
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: keytool
        env:
          PW: ${{ inputs.password }}
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias yoww \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Yoww, OU=Yoww, O=Yoww, L=-, ST=-, C=CN"
          base64 -w0 keystore.jks > keystore.jks.base64
          echo "生成完毕。keystore.jks.base64 的内容存进 Secret：ANDROID_KEYSTORE_BASE64"

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            keystore.jks
            keystore.jks.base64
          retention-days: 1
