plugins { id 'com.android.application' }

// 先算好再传。写成 versionCode (expr).toInteger() 的话 Groovy 会先把
// versionCode(expr) 当成方法调用，再对它的返回值（null）调 toInteger()，
// 构建直接报 "Value is null"。
def vName = (project.findProperty('versionNameOverride') ?: '1.0').toString()
def vCode = (project.findProperty('versionCodeOverride') ?: '1').toString().toInteger()
def ksPath = System.getenv('YOWW_KEYSTORE_PATH')

android {
  namespace 'io.github.yu7705423cell.yoww'
  compileSdk 34

  defaultConfig {
    applicationId 'io.github.yu7705423cell.yoww'
    // 29 = Android 10。写文件走 MediaStore，一个存储权限都不用申请；
    // 再往下兼容就得把旧的 WRITE_EXTERNAL_STORAGE 那一套也写一遍，
    // 为 2019 年以前的机器不值得。
    minSdk 29
    targetSdk 34
    versionCode vCode
    versionName vName
  }

  // 没有密钥就干脆不建这个 signingConfig —— 建一个 storeFile 为空的，
  // AGP 迟早会在某个环节校验它然后报一个跟真正原因无关的错
  if (ksPath) {
    signingConfigs {
      release {
        storeFile file(ksPath)
        storePassword System.getenv('YOWW_KEYSTORE_PASSWORD')
        keyAlias System.getenv('YOWW_KEY_ALIAS') ?: 'yoww'
        keyPassword System.getenv('YOWW_KEY_PASSWORD') ?: System.getenv('YOWW_KEYSTORE_PASSWORD')
      }
    }
  }

  buildTypes {
    release {
      minifyEnabled false
      if (ksPath) signingConfig signingConfigs.release
    }
  }

  // 这就是个 WebView 壳子，lint 的建议参考价值不大，
  // 不值得为它挡住一次出包
  lint { abortOnError false }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
